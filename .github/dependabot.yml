version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/tools/python"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "your-github-username"  # Replace with actual reviewer
    assignees:
      - "your-github-username"  # Replace with actual assignee
    commit-message:
      prefix: "deps"
      include: "scope"