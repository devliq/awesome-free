name: Validate YAML Schema

on:
  pull_request:
    paths:
      - 'services/**/*.yaml'
      - 'stacks/**/*.yaml'
      - 'tools/schema/*.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - run: pip install -r tools/python/requirements.txt
      - run: python tools/python/validate.py